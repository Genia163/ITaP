name: Update Google Sheet Gradebook

on:
  repository_dispatch:
    types: [update_sheet]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install gspread oauth2client

      - name: Update Google Sheet
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python - << 'EOF'
          import os, json, gspread
          from oauth2client.service_account import ServiceAccountCredentials

          # Авторизация в Google API
          scope = ['https://spreadsheets.google.com/feeds', 'https://www.googleapis.com/auth/drive']
          key_dict = json.loads(os.environ['GCP_SA_KEY'])
          creds = ServiceAccountCredentials.from_json_keyfile_dict(key_dict, scope)
          client = gspread.authorize(creds)

          sheet = client.open_by_key(os.environ['SPREADSHEET_ID']).sheet1

          payload = json.loads(os.environ['PAYLOAD'])
          student = payload['student']
          group = payload['group']
          mail = payload.get('mail', '')  # Извлекаем почту из payload (безопасно, через .get)
          req_type = payload['type']

          # Поиск строки студента (колонки: A - Студент, B - Группа)
          records = sheet.get_all_values()
          row_idx = None
          for i, row in enumerate(records[1:], start=2):
              if len(row) >= 3 and ((row[0] == student and row[1] == group) or row[2] == mail):
                  row_idx = i
                  break

          # Если студента нет — создаем новую строку
          # Порядок: A=Студент, B=Группа, C=Почта, D="", E="", F="", G=""
          if not row_idx:
              sheet.append_row([student, group, mail, "", "", "", ""])
              row_idx = len(sheet.get_all_values()) 
          
          # Обработка обновления Задания 1 (D = Колонка 4)
          if req_type == "task1":
              col_idx = 4 # Колонка D
              cell_val = sheet.cell(row_idx, col_idx).value
              attempts = 0

              
              if "Попытки удачные:" in cell_val or "Попытки неудачные:" in cell_val:
                  under = cell_val.split("|")[0]
                  attempts_luck = int(under.split("/")[0].replace("Попытки удачные:", "").strip())
                  attempts_bad = int(under.split("/")[1].replace("Попытки неудачные:", "").strip())
                  attempts = attempts_luck + attempts_bad
              attempts += 1
              
              total = payload.get('total', 0)
              score = payload.get('score', 0)
              socer_win = payload.get('socer_win', 0)
              time_ms = payload.get('time_ms', 0.0)
              ref_time = payload.get('ref_time', 0.0)
              memory_mb = payload.get('memory_mb', 0.0)
              extra_memory = payload.get('extra_memory', 0.0)

              unlack = attempts - socer_win
              if unlack < 0:
                  unlack = 0
                
              new_value = f"Попытки удачные: {socer_win} / Попытки неудачные: {unlack} | Балл: {score}/{total} | Время: {time_ms}ms (Эталон: {ref_time}ms) | Память: {memory_mb}MB (Избыток: {extra_memory}KB)"
              sheet.update_cell(row_idx, col_idx, new_value)
          
          # Обработка обновления Задания 2 и 3
          elif req_type == "task":
              # Маппинг: Номер задания -> Индекс колонки
              # Если у вас Задание 1 в D(4), Задание 2 в E(5), Задание 3 в F(6)
              col_map = {1: 4, 2: 5, 3: 6}
              col_idx = col_map.get(payload['task_num'], 4)
              
              cell_val = sheet.cell(row_idx, col_idx).value or "Попыток: 0 | Зачтено: Нет"
              
              attempts = 0
              if "Попыток:" in cell_val:
                  attempts = int(cell_val.split("|")[0].replace("Попыток:", "").strip())
              attempts += 1
              status = "Да" if (payload['passed'] or "Зачтено: Да" in cell_val) else "Нет"
              
              sheet.update_cell(row_idx, col_idx, f"Попыток: {attempts} | Зачтено: {status}")

          # Обработка обновления Тестирования (G = Колонка 7)
          elif req_type == "quiz":
              col_idx = 7
              cell_val = sheet.cell(row_idx, col_idx).value or "Попыток: 0 | Балл: 0/0"
              
              attempts = 0
              if "Попыток:" in cell_val:
                  attempts = int(cell_val.split("|")[0].replace("Попыток:", "").strip())
              attempts += 1
              score_str = f"{payload['score']}/{payload['total']}"
              
              sheet.update_cell(row_idx, col_idx, f"Попыток: {attempts} | Балл: {score_str}")
          EOF
